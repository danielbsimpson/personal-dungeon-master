[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "personal-dungeon-master"
version = "0.1.0"
description = "An AI-powered Dungeon Master for text-based tabletop RPG adventures"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "aiofiles>=23.0",
    "openai>=2.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "graphiti-core[kuzu]>=0.28",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]
voice = [
    "kokoro>=0.9.2",
    "misaki[en]>=0.9.2",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[project.scripts]
dungeon-master = "src.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length is not enforced

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
